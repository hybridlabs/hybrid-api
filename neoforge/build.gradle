plugins {
    id 'dev.hybridlabs.neoforge'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-$geckolib_version"
}

publishMods.platforms.configureEach {
    requires 'kotlin-for-forge', 'geckolib'
}

// GeckoLib 5 marks vanilla render states as GeoRenderState via NeoForge interface injection.
// hybrid-gradle does not wire dependency-provided injection data yet, so we do it here.
neoForge {
    interfaceInjectionData.from(rootProject.file('gradle/geckolib-interface-injections.json'))
}
